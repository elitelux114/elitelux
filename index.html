<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteLux Store</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f5f5;
}

header {
    background: black;
    color: gold;
    padding: 15px;
    text-align: center;
    font-size: 26px;
}

.lang-switch {
    text-align: center;
    margin: 10px;
}

button {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    cursor: pointer;
}

nav {
    display: flex;
    justify-content: center;
    background: #111;
}

nav a {
    color: white;
    padding: 12px;
    text-decoration: none;
}

.hero {
    background: url('https://images.unsplash.com/photo-1510557880182-3a9351cfe06f') center/cover;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 30px;
}

.section {
    padding: 30px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    padding: 15px;
    border-radius: 10px;
}

.product img {
    width: 100%;
}

.buy {
    background: black;
    color: white;
    padding: 10px;
    margin-top: 10px;
}

.buy:hover {
    background: gold;
    color: black;
}
</style>

<script>
function setLang(lang) {
    document.querySelectorAll("[data-en]").forEach(el => {
        el.innerText = el.getAttribute("data-" + lang);
    });
}
</script>

</head>

<body>

<header>EliteLux</header>

<div class="lang-switch">
<button onclick="setLang('en')">English</button>
<button onclick="setLang('ar')">العربية</button>
</div>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Contact</a>
</nav>

<div class="hero" data-en="Luxury You Deserve" data-ar="الفخامة التي تستحقها">
Luxury You Deserve
</div>

<div class="section">
<h2 data-en="Featured Products" data-ar="المنتجات المميزة">Featured Products</h2>

<div class="products">

<div class="product">
<img src="https://images.unsplash.com/photo-1585386959984-a41552231658">
<h3 data-en="Wireless Pro Earbuds" data-ar="سماعات لاسلكية احترافية">Wireless Pro Earbuds</h3>
<p>$99</p>
<button class="buy" onclick="order('Wireless Earbuds')">Buy</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<h3 data-en="Luxury Gold Watch" data-ar="ساعة ذهبية فاخرة">Luxury Gold Watch</h3>
<p>$199</p>
<button class="buy" onclick="order('Luxury Watch')">Buy</button>
</div>

<div class="product">
<img src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990">
<h3 data-en="Premium Accessories Set" data-ar="مجموعة إكسسوارات فاخرة">Premium Accessories Set</h3>
<p>$49</p>
<button class="buy" onclick="order('Accessories')">Buy</button>
</div>

</div>
</div>

<div class="section">
<h2 data-en="Contact Us" data-ar="تواصل معنا">Contact Us</h2>
<p>WhatsApp: +1XXXXXXXXXX</p>
</div>

<script>
function order(product) {
    let phone = "1XXXXXXXXXX"; // ضع رقمك هنا
    let message = "Hello, I want to order: " + product;
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`);
}
</script>

</body>
</html>
